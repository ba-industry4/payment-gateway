databaseChangeLog:
  - changeSet:
      id: 008-create-webhook-events-table
      author: payment-gateway
      changes:
        - createTable:
            tableName: webhook_events
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: webhook_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_webhook_events_webhook_id
                    references: webhooks(id)
                    deleteCascade: true
              - column:
                  name: event_type
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: jsonb
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(50)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: last_attempt_at
                  type: timestamp
              - column:
                  name: response_code
                  type: int
              - column:
                  name: response_body
                  type: text
              - column:
                  name: error_message
                  type: text
              - column:
                  name: delivered_at
                  type: timestamp
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_webhook_events_webhook_id
            tableName: webhook_events
            columns:
              - column:
                  name: webhook_id
        - createIndex:
            indexName: idx_webhook_events_status
            tableName: webhook_events
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_webhook_events_event_type
            tableName: webhook_events
            columns:
              - column:
                  name: event_type
