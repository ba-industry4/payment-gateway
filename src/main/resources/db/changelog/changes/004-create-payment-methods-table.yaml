databaseChangeLog:
  - changeSet:
      id: 004-create-payment-methods-table
      author: payment-gateway
      changes:
        - createTable:
            tableName: payment_methods
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_payment_methods_user_id
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: provider
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: card_last_four
                  type: varchar(4)
              - column:
                  name: card_brand
                  type: varchar(50)
              - column:
                  name: card_exp_month
                  type: int
              - column:
                  name: card_exp_year
                  type: int
              - column:
                  name: provider_payment_method_id
                  type: varchar(255)
              - column:
                  name: is_default
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_payment_methods_user_id
            tableName: payment_methods
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_payment_methods_provider_id
            tableName: payment_methods
            columns:
              - column:
                  name: provider_payment_method_id
