databaseChangeLog:
  - changeSet:
      id: 005-create-transactions-table
      author: payment-gateway
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: transaction_id
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: merchant_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transactions_merchant_id
                    references: merchants(id)
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_transactions_user_id
                    references: users(id)
              - column:
                  name: payment_method_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_transactions_payment_method_id
                    references: payment_methods(id)
              - column:
                  name: amount
                  type: decimal(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: varchar(3)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(50)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: provider
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: provider_transaction_id
                  type: varchar(255)
              - column:
                  name: description
                  type: text
              - column:
                  name: metadata
                  type: jsonb
              - column:
                  name: customer_email
                  type: varchar(255)
              - column:
                  name: customer_name
                  type: varchar(255)
              - column:
                  name: failure_reason
                  type: text
              - column:
                  name: processed_at
                  type: timestamp
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_transactions_transaction_id
            tableName: transactions
            columns:
              - column:
                  name: transaction_id
        - createIndex:
            indexName: idx_transactions_merchant_id
            tableName: transactions
            columns:
              - column:
                  name: merchant_id
        - createIndex:
            indexName: idx_transactions_user_id
            tableName: transactions
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_transactions_status
            tableName: transactions
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_transactions_provider_id
            tableName: transactions
            columns:
              - column:
                  name: provider_transaction_id
