databaseChangeLog:
  - changeSet:
      id: 010-create-audit-logs-table
      author: payment-gateway
      changes:
        - createTable:
            tableName: audit_logs
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_audit_logs_user_id
                    references: users(id)
              - column:
                  name: entity_type
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: entity_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: old_values
                  type: jsonb
              - column:
                  name: new_values
                  type: jsonb
              - column:
                  name: ip_address
                  type: varchar(45)
              - column:
                  name: user_agent
                  type: text
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_audit_logs_user_id
            tableName: audit_logs
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_audit_logs_entity
            tableName: audit_logs
            columns:
              - column:
                  name: entity_type
              - column:
                  name: entity_id
        - createIndex:
            indexName: idx_audit_logs_action
            tableName: audit_logs
            columns:
              - column:
                  name: action
        - createIndex:
            indexName: idx_audit_logs_created_at
            tableName: audit_logs
            columns:
              - column:
                  name: created_at
