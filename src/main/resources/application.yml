spring:
  application:
    name: payment-gateway
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_gateway}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

security:
  jwt:
    # IMPORTANT: Change this secret key in production! Use a strong 256-bit base64 encoded key
    # Generate with: openssl rand -base64 32
    secret-key: ${JWT_SECRET:Q0hBTkdFLVRISVMtU0VDUkVULUtFWS1JTi1QUk9EVUNUSU9OLVVTRS1TVFJPTkctS0VZ}
    expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in milliseconds

# Encryption configuration for sensitive data (provider credentials)
encryption:
  # CRITICAL: Generate a secure master key for production!
  # Run: java -cp target/payment-gateway.jar com.ba.payment.gateway.security.EncryptionService
  # Or use: EncryptionService.main() to generate a new key
  # Store in secure vault (AWS Secrets Manager, HashiCorp Vault, etc.)
  master-key: ${ENCRYPTION_MASTER_KEY:}

payment:
  stripe:
    api-key: ${STRIPE_API_KEY:sk_test_your_stripe_api_key}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_secret}
  paypal:
    client-id: ${PAYPAL_CLIENT_ID:your_paypal_client_id}
    client-secret: ${PAYPAL_CLIENT_SECRET:your_paypal_client_secret}
    mode: ${PAYPAL_MODE:sandbox} # sandbox or live

server:
  port: ${SERVER_PORT:8996}
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: INFO
    com.ba.payment.gateway: ${LOG_LEVEL:DEBUG}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:DEBUG}
    org.springframework.security: ${SECURITY_LOG_LEVEL:DEBUG}
